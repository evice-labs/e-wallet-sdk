[workspace]
resolver = "3"
members = [
    "crates/sdk-engine",
    "crates/sdk-ffi",
    "crates/cli",
    "crates/evidence-tool",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/evice-labs/e-wallet-sdk"

[workspace.dependencies]
# LEZ monorepo crates
wallet                = { path = "../logos-execution-zone/lez/wallet" }
lee                   = { path = "../logos-execution-zone/lee/state_machine" }
lee_core              = { path = "../logos-execution-zone/lee/state_machine/core" }
common                = { path = "../logos-execution-zone/lez/common" }
key_protocol          = { path = "../logos-execution-zone/lee/key_protocol" }
sequencer_service_rpc = { path = "../logos-execution-zone/lez/sequencer/service/rpc", features = ["client"] }
testnet_initial_state = { path = "../logos-execution-zone/lez/testnet_initial_state" }
bridge_core           = { path = "../logos-execution-zone/lez/programs/bridge/core" }
keycard_wallet        = { path = "../logos-execution-zone/lez/keycard_wallet" }
programs              = { path = "../logos-execution-zone/lez/programs", default-features = false }
system_accounts       = { path = "../logos-execution-zone/lez/system_accounts" }
sequencer_stake_core  = { path = "../logos-execution-zone/lez/programs/sequencer_stake/core" }
program_loader_core   = { path = "../logos-execution-zone/lez/programs/program_loader/core" }

# SDK internal crates
sdk-engine = { path = "crates/sdk-engine" }

# Third-party crates
anyhow          = "1.0.98"
async-trait     = "0.1"
bip39           = "2.2.0"
borsh           = "1.5.7"
chrono          = { version = "0.4", features = ["serde"] }
clap            = { version = "4.5.42", features = ["derive", "env"] }
dashmap         = "6"
derive_more     = { version = "2", features = ["display"] }
env_logger      = "0.11"
futures         = "0.3"
hex             = "0.4.3"
itertools       = "0.14.0"
log             = "0.4"
rand            = { version = "0.8.5", features = ["std", "std_rng", "getrandom"] }
risc0-binfmt    = "3.0.2"
risc0-zkos-v1compat = "=2.2.2"
serde           = { version = "1.0.60", features = ["derive"] }
serde_json      = "1.0.81"
argon2          = "0.5"
sha2            = "0.10"
thiserror       = "2.0"
tokio           = { version = "1.50", features = ["macros", "rt-multi-thread", "sync", "time"] }
url             = { version = "2.5.4", features = ["serde"] }
uuid            = { version = "1", features = ["v4"] }
zeroize         = "1"
