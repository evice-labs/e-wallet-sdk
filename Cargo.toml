[workspace]
resolver = "3"
members = [
    "crates/sdk-engine",
    "crates/sdk-ffi",
    "crates/cli",
    "crates/evidence-tool",
    "programs/testimonial-program",
    "tools/dispatcher",
    "integration-tests",
]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/evice-labs/e-wallet-sdk"

[workspace.dependencies]
# LEZ monorepo crates
wallet                = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "5562eeeb200d67c51ba58976ba7b0bb63c19a142", package = "wallet" }
lee                   = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "5562eeeb200d67c51ba58976ba7b0bb63c19a142", package = "lee" }
lee_core              = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "5562eeeb200d67c51ba58976ba7b0bb63c19a142", package = "lee_core" }
common                = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "5562eeeb200d67c51ba58976ba7b0bb63c19a142", package = "common" }
key_protocol          = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "5562eeeb200d67c51ba58976ba7b0bb63c19a142", package = "key_protocol" }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "5562eeeb200d67c51ba58976ba7b0bb63c19a142", package = "sequencer_service_rpc", features = ["client"] }
testnet_initial_state = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "5562eeeb200d67c51ba58976ba7b0bb63c19a142", package = "testnet_initial_state" }
bridge_core           = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "5562eeeb200d67c51ba58976ba7b0bb63c19a142", package = "bridge_core" }
keycard_wallet        = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "5562eeeb200d67c51ba58976ba7b0bb63c19a142", package = "keycard_wallet" }
programs              = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "5562eeeb200d67c51ba58976ba7b0bb63c19a142", package = "programs", default-features = false }
system_accounts       = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "5562eeeb200d67c51ba58976ba7b0bb63c19a142", package = "system_accounts" }
sequencer_stake_core  = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "5562eeeb200d67c51ba58976ba7b0bb63c19a142", package = "sequencer_stake_core" }
program_loader_core   = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "5562eeeb200d67c51ba58976ba7b0bb63c19a142", package = "program_loader_core" }

# SDK internal crates
sdk-engine          = { path = "crates/sdk-engine" }
sdk-ffi             = { path = "crates/sdk-ffi" }
testimonial-program = { path = "programs/testimonial-program" }

# Third-party crates
anyhow          = "1.0.98"
async-trait     = "0.1"
base64          = "0.22"
bip39           = "2.2.0"
borsh           = "1.5.7"
chrono          = { version = "0.4", features = ["serde"] }
clap            = { version = "4.5.42", features = ["derive", "env"] }
dashmap         = "6"
derive_more     = { version = "2", features = ["display"] }
env_logger      = "0.11"
futures         = "0.3"
hex             = "0.4.3"
itertools       = "0.14.0"
jsonrpsee       = { version = "0.26.0", features = ["client"] }
log             = "0.4"
rand            = { version = "0.8.5", features = ["std", "std_rng", "getrandom"] }
risc0-binfmt    = "3.0.2"
risc0-zkos-v1compat = "=2.2.2"
serde           = { version = "1.0.60", features = ["derive"] }
serde_json      = "1.0.81"
argon2          = "0.5"
aes-gcm         = "0.10"
sharks          = "0.5.0"
k256            = { version = "0.13", features = ["ecdh", "schnorr"] }
sha2            = "0.10"
thiserror       = "2.0"
tokio           = { version = "1.50", features = ["macros", "rt-multi-thread", "sync", "time"] }
url             = { version = "2.5.4", features = ["serde"] }
uuid            = { version = "1", features = ["v4"] }
zeroize         = "1"
rpassword       = "7.3"
