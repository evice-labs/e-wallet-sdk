[package]
name = "sdk-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Evice Wallet SDK core engine. Sessions, approval, requests, and wallet orchestration for Logos Execution Zone"

[dependencies]
# LEZ upstream
wallet.workspace = true
lee.workspace = true
lee_core.workspace = true
common.workspace = true
sequencer_service_rpc.workspace = true
testnet_initial_state.workspace = true
bridge_core = { workspace = true, features = ["host"] }

# Third-party
argon2.workspace = true
aes-gcm.workspace = true
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bip39.workspace = true
borsh.workspace = true
chrono.workspace = true
dashmap.workspace = true
hex.workspace = true
log.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
k256.workspace = true
sharks.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[[bin]]
name = "e-prover-daemon"
path = "src/bin/e-prover-daemon.rs"

[features]
default = []
# Auto-approve handler for testing/dev only. MUST NOT ship in release builds.
dev-auto-approve = []

[dev-dependencies]
jsonrpsee.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
