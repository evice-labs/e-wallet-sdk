name: CI (Linux)

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-wallet-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          path: e-wallet-sdk
      - uses: actions/checkout@v4
        with:
          repository: logos-blockchain/logos-execution-zone
          path: logos-execution-zone
          ref: dev
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: e-wallet-sdk
      - name: Verify source formatting
        run: cargo fmt --all -- --check
      - name: Check workspace compilation
        run: cargo check --workspace
      - name: Run workspace test suite
        run: cargo test --workspace
      - name: Check clippy lints
        run: cargo clippy --workspace -- -D warnings

  # Security audit: verify no dev-auto-approve symbol in release
  release-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-wallet-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          path: e-wallet-sdk
      - uses: actions/checkout@v4
        with:
          repository: logos-blockchain/logos-execution-zone
          path: logos-execution-zone
          ref: dev
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p sdk-ffi
      - run: |
          if nm target/release/libsdk_ffi.so 2>/dev/null | grep -q PolicyApprovalHandler; then
            echo "ERROR: PolicyApprovalHandler found in release build!"
            exit 1
          fi
          echo "OK: no dev-auto-approve symbols in release"
