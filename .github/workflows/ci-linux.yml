name: CI (Linux)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-wallet-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          path: e-wallet-sdk
      - uses: actions/checkout@v4
        with:
          repository: logos-blockchain/logos-execution-zone
          path: logos-execution-zone
          ref: 85145656c4dd96ac1eadbe7b035b300af8d24c2a
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: e-wallet-sdk
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings

  # Security audit: verify no dev-auto-approve symbol in release
  release-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-wallet-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          path: e-wallet-sdk
      - uses: actions/checkout@v4
        with:
          repository: logos-blockchain/logos-execution-zone
          path: logos-execution-zone
          ref: 85145656c4dd96ac1eadbe7b035b300af8d24c2a
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p sdk-ffi
      - run: |
          if nm target/release/libsdk_ffi.so 2>/dev/null | grep -q PolicyApprovalHandler; then
            echo "ERROR: PolicyApprovalHandler found in release build!"
            exit 1
          fi
          echo "OK: no dev-auto-approve symbols in release"
