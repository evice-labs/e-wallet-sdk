name: Testnet Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-wallet-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          path: e-wallet-sdk
      - uses: actions/checkout@v4
        with:
          repository: logos-blockchain/logos-execution-zone
          path: logos-execution-zone
          ref: ${{ vars.LEZ_COMMIT || 'dev' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: e-wallet-sdk
      - name: Verify source formatting
        run: cargo fmt --all -- --check
      - name: Build workspace binaries
        run: cargo build --bins
      - name: Testnet integration smoke tests
        run: |
          echo "1. Verify Wallet CLI Info & Engine State"
          cargo run --bin evice-wallet -- info

          echo "2. Verify Logos Name Service (.lez) Resolver"
          cargo run --bin evice-wallet -- resolve alice.lez

          echo "3. Verify Multi-Network Deployment Registry"
          cargo run -p lez-dispatcher -- status

          echo "4. Verify Testnet Adoption Evidence Tool"
          cargo run -p evidence-tool -- --format text

