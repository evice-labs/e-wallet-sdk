name: Testnet Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-wallet-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          path: e-wallet-sdk
      - uses: actions/checkout@v4
        with:
          repository: logos-blockchain/logos-execution-zone
          path: logos-execution-zone
          ref: ${{ vars.LEZ_COMMIT || 'dev' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: e-wallet-sdk
      - name: Verify source formatting
        run: cargo fmt --all -- --check
      - name: Build wallet CLI
        run: cargo build --bin lez-wallet
      - name: Smoke test execution
        run: |
          # TODO: Real-proof smoke test against testnet 0.4
          echo "Smoke test placeholder — connect to testnet and verify basic operations"
          cargo run --bin lez-wallet -- info
