name: CI (macOS)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: e-wallet-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          path: e-wallet-sdk
      - uses: actions/checkout@v4
        with:
          repository: logos-blockchain/logos-execution-zone
          path: logos-execution-zone
          ref: dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: e-wallet-sdk
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo build --workspace --all-targets
      - name: Build and package release dylib for macOS Apple Silicon
        run: |
          cargo build --release -p sdk-ffi
          install_name_tool -id @rpath/liblez_wallet_sdk.dylib target/release/libsdk_ffi.dylib
          codesign -s - -f target/release/libsdk_ffi.dylib
          cp target/release/libsdk_ffi.dylib liblez_wallet_sdk.dylib
      - name: Upload macOS Apple Silicon SDK dylib
        uses: actions/upload-artifact@v4
        with:
          name: liblez_wallet_sdk-macos-arm64
          path: e-wallet-sdk/liblez_wallet_sdk.dylib
