name: CI (macOS)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: e-wallet-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          path: e-wallet-sdk
      - uses: actions/checkout@v4
        with:
          repository: logos-blockchain/logos-execution-zone
          path: logos-execution-zone
          ref: dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: e-wallet-sdk
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo build --workspace --all-targets
      - name: Build and package release dylib for macOS Apple Silicon
        run: |
          cargo build --release -p sdk-ffi
          DYLIB_PATH="target/release/libe_wallet_sdk.dylib"
          if [ ! -f "$DYLIB_PATH" ]; then DYLIB_PATH="target/release/libsdk_ffi.dylib"; fi
          install_name_tool -id @rpath/libe_wallet_sdk.dylib "$DYLIB_PATH"
          codesign -s - -f "$DYLIB_PATH"
          cp "$DYLIB_PATH" libe_wallet_sdk.dylib
      - name: Upload macOS Apple Silicon SDK dylib
        uses: actions/upload-artifact@v4
        with:
          name: libe_wallet_sdk-macos-arm64
          path: e-wallet-sdk/libe_wallet_sdk.dylib
